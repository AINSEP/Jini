rules:
  - id: log-raw-error
    languages: [typescript, javascript]
    severity: WARNING
    message: Raw caught error text may expose provider/importer credentials. Use the canonical redaction helper or a fixed diagnostic.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  try { ... } catch ($ERROR) { ... }
              - pattern-inside: |
                  $PROMISE.catch(($ERROR) => { ... })
              - pattern-inside: $PROMISE.catch(($ERROR) => $BODY)
          - pattern-either:
              - pattern: $ERROR.message
              - pattern: String($ERROR)
        exact: true
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$METHOD(..., $TEXT, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:log|error|warn|info|debug|trace|fatal)$
          - focus-metavariable: $TEXT
        exact: true
    pattern-sanitizers:
      - pattern: redactSecrets(...)
      - pattern: redactText(...)
      - pattern: redactSecretShapes(...)
