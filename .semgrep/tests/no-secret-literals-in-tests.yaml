rules:
  - id: no-secret-literals-in-tests
    languages: [typescript, javascript]
    severity: ERROR
    message: Credential-prefixed string literal in a test. Build synthetic credentials at runtime from a bare prefix and generated suffix.
    paths:
      include:
        - '**/*.test.*'
        - '**/*.spec.*'
        - '**/__tests__/**'
        - '**/tests/**'
        - '**/test/**'
    patterns:
      - pattern: '"$SECRET"'
      # Short, obviously synthetic suffixes are also forbidden. This is a fixture
      # policy, not a replacement for core's full credential-shape catalog.
      - metavariable-regex:
          metavariable: $SECRET
          regex: .*(?:ghp_|github_pat_|sk-|AKIA|xox[bp]-)[A-Za-z0-9_-]+
