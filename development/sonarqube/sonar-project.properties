# Dormant SonarQube Cloud setup; enable only when the repository is public.
sonar.organization=REPLACE_WITH_ORGANIZATION
# sonar.sources takes literal directories, not wildcard patterns.
sonar.projectKey=REPLACE_WITH_PROJECT_KEY
sonar.projectName=Jini
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.sources=packages/admin/src,packages/agent-plugins/src,packages/agent-runtime/src,packages/agentic/src,packages/analytics/src,packages/artifacts/src,packages/capability-providers/src,packages/charts-recharts/src,packages/chat/src,packages/cli/src,packages/cms/forms/src,packages/cms/src,packages/commerce/src,packages/core/src,packages/daemon/src,packages/db/src,packages/desktop-host/src,packages/devops/src,packages/diagnostics/src,packages/http-kit/src,packages/infra/src,packages/integrations/src,packages/mcp/src,packages/memory/src,packages/oauth/src,packages/platform/src,packages/plugins/src,packages/protocol/src,packages/registry/src,packages/sandbox/src,packages/server/src,packages/sidecar/src,packages/sqlite/src,packages/ui-kit/src,packages/ui/src,packages/user-management/src,packages/vibecoding/src
sonar.tests=packages
# Matching test paths are automatically excluded from source indexing by Sonar.
sonar.test.inclusions=**/__tests__/**,**/tests/**,**/test/**,**/*.test.*,**/*.spec.*
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,**/.generated/**,**/*.generated.*,**/*.snap
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,**/.generated/**,**/*.snap
# Only test code is omitted from coverage; no production-code metric exclusions.
sonar.coverage.exclusions=**/__tests__/**,**/tests/**,**/test/**,**/*.test.*,**/*.spec.*
# Before enabling Cloud, generate reports with repository-relative SF: paths.
sonar.javascript.lcov.reportPaths=packages/*/coverage/lcov.info,packages/cms/forms/coverage/lcov.info
sonar.qualitygate.wait=false
