openapi: 3.0.3
info:
  title: Jini daemon media-generation routes
  version: 0.0.0
  description: |
    Code-first fragment for `media.ts`'s four routes in `@jini-ai/http-kit` — an
    async "request-now, poll-later" task shape over host-injected
    `MediaDispatchEngine`/`MediaTaskStore` ports (no `@jini-ai/media` dependency
    from this locked package). `POST /api/media/generate` creates a `'queued'`
    task and kicks off generation in the background (never awaited by the
    response — a real provider call can take tens of seconds), returning
    immediately; a caller polls `GET /api/media/tasks/:id` until the task
    reaches a terminal status (`done`/`failed`/`interrupted`). Generated bytes
    are base64-encoded into a `data:` URL on `MediaTask.file` — this route pack
    invents no separate asset-storage port.

    **Security-relevant asymmetry worth a second look**: unlike `db-ops.yaml`
    and `tool-catalog.yaml` (where every route, including plain GETs, requires
    same-origin because they disclose internal state), only the two mutating
    routes here (`POST /generate`, `DELETE /tasks/:id`) require same-origin.
    `GET /api/media/tasks` and `GET /api/media/tasks/:id` do not — a caller
    that knows (or guesses) an `ownerRef`/task id can read generated content
    (including the base64 payload) cross-origin. This may be intentional (task
    ids are opaque UUIDs and `ownerRef` is host-defined), but it is a real
    inconsistency against this same package's own db-ops/tool-catalog
    precedent of gating discovery-shaped GETs, not just mutations.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port: { default: '0', description: Resolved host listen port. }
paths:
  /api/media/generate:
    post:
      operationId: generate_media
      summary: Queue a media-generation task
      description: Returns the freshly-`queued` task immediately; generation runs in the background. Poll `GET /api/media/tasks/:id` for the terminal result.
      x-jini-require-same-origin: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MediaGenerateRequest' } } }
      responses:
        '202': { description: Task queued., content: { application/json: { schema: { $ref: '#/components/schemas/MediaGenerateResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: 'Task-store write failed before a task could be created. Adapter-generated errors include a correlation requestId in error.details.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/media/tasks:
    get:
      operationId: list_media_tasks
      summary: List media tasks by owner
      x-jini-require-same-origin: false
      parameters:
        - { name: ownerRef, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: includeTerminal, in: query, required: false, schema: { type: string, enum: ['true', 'false'] }, description: 'Any value other than the literal string `true` is treated as `false`.' }
      responses:
        '200': { description: Tasks for the given owner., content: { application/json: { schema: { $ref: '#/components/schemas/MediaTaskListResponse' } } } }
        '400': { description: '`ownerRef` query parameter is missing or empty.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/media/tasks/{id}:
    get:
      operationId: get_media_task
      summary: Read one media task
      x-jini-require-same-origin: false
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200': { description: Task., content: { application/json: { schema: { $ref: '#/components/schemas/MediaTaskResponse' } } } }
        '404': { description: No media task with this id., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: delete_media_task
      summary: Delete one media task
      x-jini-require-same-origin: true
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/MediaTaskDeleteResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No media task with this id., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    optionalBearer:
      type: http
      scheme: bearer
      description: When the host enables `JINI_API_TOKEN`, the global `/api` middleware requires this token except for health/ready/version probes and permitted direct loopback peers.
  parameters:
    TaskId: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
  responses:
    Forbidden: { description: Same-origin guard rejected the request., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    BadRequest: { description: Body failed validation (see the `MediaGenerateRequest` field constraints)., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    InternalError: { description: 'Task-store failure. Adapter-generated errors include a correlation requestId in error.details; the real error (which may include vendor SDK/network detail) is never sent to the caller (SEC-005).', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: {} } } }
    MediaImageReference: { type: object, required: [dataUrl], properties: { dataUrl: { type: string } } }
    MediaGenerateRequest:
      type: object
      required: [ownerRef, surface, model]
      description: Host-defined `ownerRef` (e.g. a run id) scopes the task the same way it scopes `active-context.ts`/`delegated-tools.ts`'s coupling.
      properties:
        ownerRef: { type: string, minLength: 1 }
        surface: { type: string, enum: [image, video, audio] }
        model: { type: string, minLength: 1 }
        prompt: { type: string }
        aspect: { type: string }
        length: { type: number }
        duration: { type: number }
        voice: { type: string }
        audioKind: { type: string, enum: [music, speech, sfx] }
        language: { type: string }
        loop: { type: boolean }
        promptInfluence: { type: number }
        imageRef: { $ref: '#/components/schemas/MediaImageReference' }
        imageRefs: { type: array, items: { $ref: '#/components/schemas/MediaImageReference' } }
        wireModel: { type: string }
        speechFormat: { type: string, enum: [mp3, wav, flac, aac, opus] }
    MediaTaskError: { type: object, required: [message], properties: { message: { type: string }, status: { type: number }, code: { type: string } } }
    MediaTask:
      type: object
      required: [id, ownerRef, status, progress, file, error, startedAt, endedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        ownerRef: { type: string }
        status: { type: string, enum: [queued, running, done, failed, interrupted] }
        surface: { type: string }
        model: { type: string }
        progress: { type: array, items: { type: string } }
        file: { description: 'A `{dataUrl, providerId, providerNote, suggestedExt?, usedStubFallback}` object once terminal; `null` until then. Deliberately untyped at the store layer.', nullable: true }
        error: { oneOf: [ { $ref: '#/components/schemas/MediaTaskError' }, { type: 'null' } ] }
        startedAt: { type: number, description: Epoch milliseconds. }
        endedAt: { type: number, nullable: true, description: Epoch milliseconds. }
        createdAt: { type: number, description: Epoch milliseconds. }
        updatedAt: { type: number, description: Epoch milliseconds. }
    MediaGenerateResponse: { type: object, required: [task], properties: { task: { $ref: '#/components/schemas/MediaTask' } } }
    MediaTaskResponse: { type: object, required: [task], properties: { task: { $ref: '#/components/schemas/MediaTask' } } }
    MediaTaskDeleteResponse: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } }
    MediaTaskListResponse: { type: object, required: [tasks], properties: { tasks: { type: array, items: { $ref: '#/components/schemas/MediaTask' } } } }
