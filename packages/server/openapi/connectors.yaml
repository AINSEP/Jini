openapi: 3.0.3
info:
  title: Jini connectors route pack
  version: 0.0.0
  description: |
    Code-first fragment for `packages/http-kit/src/connectors.ts` — JSON transport over five
    narrow, independently optional provider ports (`auth`, `storage`, `payments`, `db`,
    `realtime`). The ports themselves have no HTTP opinion; concrete adapters (e.g.
    `@jini-ai/capability-providers`) satisfy them structurally at a host's composition
    root — this transport package deliberately does not depend on any implementation.

    **`NOT_CONFIGURED` (503) is the common case, not an edge case.** Every route's first
    check is whether its one required capability slot was supplied. `@jini-ai/server`
    mounts this pack zero-config (`registerConnectorsRoutes(app, {}, services.context.adapter)`
    in `packages/server/src/builtin-features.ts`), which leaves all five slots unconfigured
    by default. Concretely: on a stock daemon built from this repo, every route below is
    live on the wire and answers `503 NOT_CONFIGURED` until a host supplies real providers
    at its own composition root — there is no separate "connectors disabled" state, and no
    404 to signal that.

    **SEC-005 throughout.** Every provider call is wrapped (`guardedCall`) so a raw
    Stripe/SQL/JWT/WebSocket error never reaches the caller verbatim — a correlation-id-
    bearing generic `INTERNAL_ERROR` instead, with the real error reaching only a
    host-owned `onInternalError` sink.

    **Same-origin guard is asymmetric by read/write, not applied uniformly.** Every
    mutating route (`POST`/`PUT`/`PATCH`/`DELETE`) requires same-origin; every plain `GET`
    (storage get/list, payments get, db get/query) does not. This is the opposite of
    `component-catalog.ts`'s pair, which guards two `GET`s — see that fragment's own note.

    **Wire shapes are this route pack's own choice, not the ports'**:
    - `StorageProvider.put`/`.get` deal in raw `Uint8Array`; JSON has no binary type, so
      this pack base64-encodes on the wire (`dataBase64`), the same convention
      `media.ts#runMediaGenerationInBackground` uses for generated bytes. The decoder
      (`isWellFormedBase64`) is intentionally strict — canonical alphabet, a length that is
      a whole number of 4-character groups, at most two trailing `=` — specifically because
      `Buffer.from(value, 'base64')` never rejects malformed input; it silently drops
      out-of-alphabet characters and would otherwise let a truncated or garbled payload
      overwrite whatever already lived at a storage key.
    - `AuthProvider.verifySession` takes a bearer token, but this route accepts it in a
      `POST` JSON body (`/api/connectors/auth/session`), not an `Authorization` header —
      credentials do not belong in URLs, and this keeps the same shape as the other auth
      routes rather than introducing a second convention for one endpoint.
    - `DbProvider.query`'s optional `where` filter travels as a JSON-encoded string in the
      `?where=` query parameter (e.g. `?where=%7B%22status%22%3A%22active%22%7D`), decoded
      and validated as a plain object before reaching the provider.
    - `RealtimeProvider.subscribe` has deliberately no route here: a request/response JSON
      route cannot keep a connection alive to push future events, which is inherently a
      streaming concern out of scope for this pack. `publish` is the one realtime operation
      that fits.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port: { default: '0', description: Resolved host listen port. }
paths:
  /api/connectors/auth/signup:
    post:
      operationId: auth_sign_up
      summary: Create an auth user via the configured AuthProvider
      x-jini-require-same-origin: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthCredentials' } } } }
      responses:
        '201': { description: User created, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsAuthUserResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredAuth' }
  /api/connectors/auth/signin:
    post:
      operationId: auth_sign_in
      summary: Sign in via the configured AuthProvider
      x-jini-require-same-origin: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthCredentials' } } } }
      responses:
        '200': { description: Session issued, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsAuthSessionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredAuth' }
  /api/connectors/auth/signout:
    post:
      operationId: auth_sign_out
      summary: Sign out (invalidate a token) via the configured AuthProvider
      x-jini-require-same-origin: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenRequest' } } } }
      responses:
        '200': { description: Signed out, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsOkResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredAuth' }
  /api/connectors/auth/session:
    post:
      operationId: auth_verify_session
      summary: Verify a bearer token via the configured AuthProvider
      x-jini-require-same-origin: true
      description: 'Token travels in the JSON body, not an `Authorization` header. An unknown/expired token is `200` with `user: null`, not a `404`/`401`.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenRequest' } } } }
      responses:
        '200': { description: Verification result (user may be null), content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsAuthVerifyResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredAuth' }
  /api/connectors/storage/{key}:
    put:
      operationId: storage_put
      summary: Write an object via the configured StorageProvider
      x-jini-require-same-origin: true
      parameters: [ { $ref: '#/components/parameters/StorageKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoragePutRequest' } } } }
      responses:
        '200': { description: Object written, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsStorageMetaResponse' } } } }
        '400': { description: 'Missing/malformed `dataBase64` (strict well-formedness check — see this fragment''s top-level description) or invalid `contentType`.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredStorage' }
    get:
      operationId: storage_get
      summary: Read an object via the configured StorageProvider
      description: No same-origin guard (read-only). Bytes travel base64-encoded as `dataBase64`.
      parameters: [ { $ref: '#/components/parameters/StorageKey' } ]
      responses:
        '200': { description: Object bytes, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsStorageGetResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredStorage' }
    delete:
      operationId: storage_delete
      summary: Delete an object via the configured StorageProvider
      x-jini-require-same-origin: true
      parameters: [ { $ref: '#/components/parameters/StorageKey' } ]
      responses:
        '200': { description: Deleted (provider semantics; not verified idempotent by this route), content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsOkResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredStorage' }
  /api/connectors/storage:
    get:
      operationId: storage_list
      summary: List objects via the configured StorageProvider
      description: No same-origin guard (read-only).
      parameters:
        - { name: prefix, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Object metadata list, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsStorageListResponse' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredStorage' }
  /api/connectors/payments/charge:
    post:
      operationId: payments_charge
      summary: Create a charge via the configured PaymentsProvider
      x-jini-require-same-origin: true
      description: '`amountCents` must be a positive `Number.isSafeInteger` — fractional or non-finite amounts are rejected before reaching the provider.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChargeInput' } } } }
      responses:
        '201': { description: Charge created, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsChargeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredPayments' }
  /api/connectors/payments/{id}:
    get:
      operationId: payments_get_charge
      summary: Read a charge via the configured PaymentsProvider
      description: No same-origin guard (read-only).
      parameters: [ { $ref: '#/components/parameters/ChargeId' } ]
      responses:
        '200': { description: Charge, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsChargeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredPayments' }
  /api/connectors/payments/{id}/refund:
    post:
      operationId: payments_refund
      summary: Refund a charge via the configured PaymentsProvider
      x-jini-require-same-origin: true
      parameters: [ { $ref: '#/components/parameters/ChargeId' } ]
      responses:
        '200': { description: Refunded charge, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsChargeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredPayments' }
  /api/connectors/db/{collection}:
    post:
      operationId: db_insert
      summary: Insert a record via the configured DbProvider
      x-jini-require-same-origin: true
      description: 'The JSON body itself becomes the `DbRecord`: every field is passed through to the provider, not just a nested `record` field. `id` is the only required field.'
      parameters: [ { $ref: '#/components/parameters/DbCollection' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DbRecord' } } } }
      responses:
        '201': { description: Record inserted, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsDbRecordResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredDb' }
    get:
      operationId: db_query
      summary: Query records via the configured DbProvider
      description: No same-origin guard (read-only). `where`, if present, must be a JSON-object-encoded string; malformed JSON or a non-object is a 400.
      parameters:
        - { $ref: '#/components/parameters/DbCollection' }
        - { name: where, in: query, required: false, schema: { type: string }, description: 'JSON-encoded object, e.g. `{"status":"active"}`.' }
      responses:
        '200': { description: Matching records, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsDbQueryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredDb' }
  /api/connectors/db/{collection}/{id}:
    get:
      operationId: db_get
      summary: Read one record via the configured DbProvider
      description: No same-origin guard (read-only).
      parameters: [ { $ref: '#/components/parameters/DbCollection' }, { $ref: '#/components/parameters/DbRecordId' } ]
      responses:
        '200': { description: Record, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsDbRecordResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredDb' }
    patch:
      operationId: db_update
      summary: Patch one record via the configured DbProvider
      x-jini-require-same-origin: true
      description: The JSON body is passed through as the patch object verbatim (no field allowlist at this layer).
      parameters: [ { $ref: '#/components/parameters/DbCollection' }, { $ref: '#/components/parameters/DbRecordId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Updated record, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsDbRecordResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredDb' }
    delete:
      operationId: db_delete
      summary: Delete one record via the configured DbProvider
      x-jini-require-same-origin: true
      description: 'Succeeds with `{ ok: true }` regardless of whether the record existed — the provider''s `delete` return type is `void`, so this route has no way to report "not found" here (contrast `db_get`/`db_update`, which do 404).'
      parameters: [ { $ref: '#/components/parameters/DbCollection' }, { $ref: '#/components/parameters/DbRecordId' } ]
      responses:
        '200': { description: Deletion accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsOkResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredDb' }
  /api/connectors/realtime/{channel}/publish:
    post:
      operationId: realtime_publish
      summary: Publish one event on a channel via the configured RealtimeProvider
      x-jini-require-same-origin: true
      description: The only realtime operation exposed over HTTP; `subscribe` has no route (see this fragment's top-level description).
      parameters:
        - { name: channel, in: path, required: true, schema: { type: string, minLength: 1 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RealtimePublishRequest' } } } }
      responses:
        '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorsOkResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfiguredRealtime' }
components:
  parameters:
    StorageKey: { name: key, in: path, required: true, schema: { type: string, minLength: 1 } }
    ChargeId: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    DbCollection: { name: collection, in: path, required: true, schema: { type: string, minLength: 1 } }
    DbRecordId: { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Same-origin guard rejected the request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    InternalError: { description: 'Internal error (SEC-005 redacted); adapter-generated errors include a correlation requestId in error.details.', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotConfiguredAuth: { description: No `AuthProvider` configured on this daemon., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotConfiguredStorage: { description: No `StorageProvider` configured on this daemon., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotConfiguredPayments: { description: No `PaymentsProvider` configured on this daemon., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotConfiguredDb: { description: No `DbProvider` configured on this daemon., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotConfiguredRealtime: { description: No `RealtimeProvider` configured on this daemon., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: {} } } }
    AuthCredentials: { type: object, required: [email, password], properties: { email: { type: string, minLength: 1 }, password: { type: string, minLength: 1 } } }
    AuthTokenRequest: { type: object, required: [token], properties: { token: { type: string, minLength: 1 } } }
    AuthUser: { type: object, required: [id, email, createdAt], properties: { id: { type: string }, email: { type: string }, createdAt: { type: number } } }
    AuthSession: { type: object, required: [token, userId, expiresAt], properties: { token: { type: string }, userId: { type: string }, expiresAt: { type: number } } }
    ConnectorsAuthUserResponse: { type: object, required: [user], properties: { user: { $ref: '#/components/schemas/AuthUser' } } }
    ConnectorsAuthSessionResponse: { type: object, required: [session], properties: { session: { $ref: '#/components/schemas/AuthSession' } } }
    ConnectorsAuthVerifyResponse: { type: object, required: [user], properties: { user: { oneOf: [ { $ref: '#/components/schemas/AuthUser' }, { type: 'null' } ] } } }
    ConnectorsOkResponse: { type: object, required: [ok], properties: { ok: { type: boolean, enum: [true] } } }
    StoragePutRequest:
      type: object
      required: [dataBase64]
      properties:
        dataBase64: { type: string, description: 'Strictly-validated base64 (canonical alphabet, length a multiple of 4, at most two trailing `=`, non-empty) — see this fragment''s top-level description.' }
        contentType: { type: string }
    StorageObjectMeta: { type: object, required: [key, size, updatedAt], properties: { key: { type: string }, size: { type: integer, minimum: 0 }, contentType: { type: string }, updatedAt: { type: number } } }
    ConnectorsStorageMetaResponse: { type: object, required: [object], properties: { object: { $ref: '#/components/schemas/StorageObjectMeta' } } }
    ConnectorsStorageGetResponse: { type: object, required: [dataBase64], properties: { dataBase64: { type: string } } }
    ConnectorsStorageListResponse: { type: object, required: [objects], properties: { objects: { type: array, items: { $ref: '#/components/schemas/StorageObjectMeta' } } } }
    ChargeInput:
      type: object
      required: [amountCents, currency, customerRef]
      properties:
        amountCents: { type: integer, minimum: 1, description: Whole positive cents; rejects fractional and non-safe-integer values before the provider sees them. }
        currency: { type: string, minLength: 1 }
        customerRef: { type: string, minLength: 1 }
        description: { type: string }
    Charge:
      type: object
      required: [id, status, amountCents, currency, customerRef, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, refunded] }
        amountCents: { type: integer }
        currency: { type: string }
        customerRef: { type: string }
        createdAt: { type: number }
    ConnectorsChargeResponse: { type: object, required: [charge], properties: { charge: { $ref: '#/components/schemas/Charge' } } }
    DbRecord:
      type: object
      required: [id]
      properties: { id: { type: string, minLength: 1 } }
      additionalProperties: true
      description: The full JSON request body for `db_insert` becomes this record verbatim — `id` is the only field this route validates.
    ConnectorsDbRecordResponse: { type: object, required: [record], properties: { record: { $ref: '#/components/schemas/DbRecord' } } }
    ConnectorsDbQueryResponse: { type: object, required: [records], properties: { records: { type: array, items: { $ref: '#/components/schemas/DbRecord' } } } }
    RealtimePublishRequest:
      type: object
      required: [event]
      properties: { event: { description: Arbitrary JSON value, passed through to `RealtimeProvider.publish` unvalidated. } }
