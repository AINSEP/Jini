<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MCP-UI E2E host</title>
</head>
<body>
  <h2>Host page (outside the sandbox)</h2>
  <p>This implements the exact same handshake <code>AppRenderer</code> from <code>@mcp-ui/client</code>
     performs, using the real UIResource produced by <code>@mcp-ui/server</code>'s
     <code>createUIResource()</code> (see resource.json, generated by gen-checkbox-resource.mjs).</p>
  <iframe
    id="mcp-ui-sandbox"
    src="./sandbox-proxy.html"
    sandbox="allow-scripts allow-same-origin allow-forms"
    style="width: 480px; height: 260px; border: 2px solid #444;"
    data-testid="mcp-ui-sandbox-iframe"
  ></iframe>
  <p id="status" data-testid="handshake-status">waiting for handshake...</p>

  <script type="module">
    const iframe = document.getElementById('mcp-ui-sandbox');
    const status = document.getElementById('status');

    const resp = await fetch('./resource.json');
    const resource = await resp.json();
    const html = resource.resource.text;

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.method === 'ui/notifications/sandbox-proxy-ready') {
        status.textContent = 'handshake received, sending real resource HTML...';
        iframe.contentWindow.postMessage(
          { method: 'ui/notifications/sandbox-resource-ready', params: { html } },
          '*'
        );
        status.textContent = 'sent';
        status.dataset.done = 'true';
      }
    });
  </script>
</body>
</html>
