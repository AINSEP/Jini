name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      - run: pnpm exec tsx scripts/publish-pending.ts --plan
      - run: pnpm guard:plugins
      - run: pnpm guard:plugins:catalog
      - run: pnpm guard:plugins:packed

      - name: Pack candidate
        env:
          JINI_CANDIDATE_DIR: ${{ runner.temp }}/jini-candidate
        run: |
          mkdir -p "$JINI_CANDIDATE_DIR"
          echo "Candidate commit: $GITHUB_SHA"
          node --import tsx --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import { assertJiniPackagePublicationAllowed, discoverJiniPackages } from './scripts/lib/pack-jini-packages.ts';

          for (const [name, entry] of discoverJiniPackages({ workspaceRoot: process.cwd() })) {
            if (entry.pkg.private === true) continue;
            assertJiniPackagePublicationAllowed({ name });
            const dist = `${entry.dir}/dist`;
            if (existsSync(dist)) {
              execFileSync('find', [dist, '-name', '*.map', '-delete'], { stdio: 'inherit' });
            }
            execFileSync('pnpm', ['pack', '--pack-destination', process.env.JINI_CANDIDATE_DIR], {
              cwd: entry.dir,
              stdio: 'inherit',
            });
          }
          NODE
          sha256sum "$JINI_CANDIDATE_DIR"/*.tgz

      - name: Install and import candidate
        run: |
          mkdir -p "$RUNNER_TEMP/jini-consumer"
          cd "$RUNNER_TEMP/jini-consumer"
          npm init -y
          npm install "$RUNNER_TEMP/jini-candidate"/*.tgz --ignore-scripts --no-audit --no-fund
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync } from 'node:fs';
          import { resolve } from 'node:path';

          const candidateDir = `${process.env.RUNNER_TEMP}/jini-candidate`;
          const archives = new Set(readdirSync(candidateDir)
            .filter(name => name.endsWith('.tgz'))
            .map(name => resolve(candidateDir, name)));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const forms = JSON.parse(readFileSync(`${process.env.GITHUB_WORKSPACE}/packages/cms/forms/package.json`, 'utf8'));
          assert.ok(lock.packages[`node_modules/${forms.name}`], 'Nested CMS forms must be installed from the candidate');
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (!path.split('node_modules/').at(-1).startsWith('@jini-ai/')) continue;
            assert.notEqual(entry.link, true, `${path} must not be a workspace link`);
            assert.match(entry.resolved, /^file:/, `${path} must resolve to a local candidate archive`);
            assert.ok(archives.has(resolve(entry.resolved.slice(5))), `${path} must resolve to an archive from this candidate`);
          }

          await import('@jini-ai/cms/presentation/html');
          await import('@jini-ai/agent-plugins/cloudflare/lib/forms.mjs');
          NODE
