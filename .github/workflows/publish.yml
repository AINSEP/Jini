name: Publish to npm

# Publishes every public @jini-ai/* package whose package.json version is not on npm yet, with no
# token or one-time code: npm "trusted publishing" authenticates this workflow through GitHub's OIDC
# identity instead. Bump the versions you want released, commit, then push a `release-*` tag (e.g.
# `git tag release-2026-09-29 && git push origin release-2026-09-29`), or run it by hand from the
# Actions tab (workflow_dispatch publishes whatever the chosen ref holds; its optional `packages`
# input, e.g. `agent-runtime,daemon,mcp,ui,chat`, limits the run to those names). The Actions tab
# only offers workflows that exist on the default branch (main), so until this file is on main use
# a tag. A tag can carry the same filter after `.only.`, names separated by dots (package names
# have none): `release-2026-09-29.only.agent-runtime.daemon.mcp.ui.chat` publishes just those five.
# An unknown name fails the run before anything is published.
#
# One-time setup on npmjs.com, per package: package → Settings → Trusted Publisher → GitHub Actions,
# organization/user `AINSEP`, repository `Jini`, workflow filename `publish.yml` (no environment).
# A package that has never been published has no settings page yet, so it cannot have a trusted
# publisher: the run skips it with a warning instead of failing. The job summary lists what was
# published, what was already on npm, and what was skipped as never published.
#
# Already-published versions are skipped (scripts/publish-pending.ts), so re-running after a partial
# failure is safe. `pnpm exec tsx scripts/publish-pending.ts --plan` prints, read-only, what a run
# would publish.
#
# Replaces the dormant Changesets + NPM_TOKEN workflow (2026-09-29).

on:
  push:
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      packages:
        description: 'Only these packages, comma-separated short names (e.g. ui,chat). Empty = all pending.'
        required: false
        default: ''

concurrency: publish

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      # tsconfig.base.json emits source maps for local debugging; published tarballs carry none.
      # Several packages' "files" do not exclude them, so drop them here (publish-pending.ts
      # refuses any tarball that still has one).
      - run: find packages/*/dist -name '*.map' -delete

      # Passed through env, not interpolated into the script, so the input cannot inject shell.
      - run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == *.only.* ]]; then
            PACKAGES="${GITHUB_REF_NAME#*.only.}"
            PACKAGES="${PACKAGES//./,}"
          fi
          pnpm exec tsx scripts/publish-pending.ts ${PACKAGES:+--only "$PACKAGES"}
        env:
          PACKAGES: ${{ inputs.packages }}
