# Quality-gate CI. Added 2026-08-16: before this, `.github/workflows/` had exactly one workflow
# (`publish.yml`, a dormant Changesets publisher) — nothing ran any quality gate on push or PR,
# despite three already existing and self-tested: `pnpm guard` (import boundaries, deep-path bans,
# product-neutrality strings, DOM/universal split purity, driver isolation), `pnpm typecheck`, and
# `pnpm complexity`. See the 2026-08-16 Jini failure-mode audit for the full context.
#
# `pnpm guard` itself found 25 pre-existing violations, accumulated since 2026-08-03 with nothing
# enforcing it. Rather than block adoption on fixing all 25 first (real application-code changes
# across 5+ feature packages — someone else's call, not this workflow's) or shipping a gate that is
# red from its first run (which tends to get ignored or disabled within days), CI runs
# `pnpm guard:drift` instead of raw `pnpm guard`: the same checks, ratcheted against
# `scripts/guard-baseline.json`'s snapshot of the 25 known violations, so it fails ONLY on a NEW
# one. See that script's own module doc for the diff mechanics and `scripts/guard-baseline.json`'s
# `_comment` for how the baseline is meant to shrink over time.
#
# `pnpm typecheck` needed no such ratchet — its one failure (`examples/reference-web`, a real
# interface-shape mismatch after `DomPageDriverPage` gained a `label` field) was small and
# mechanical enough to just fix directly; it runs here unmodified and fully blocking.
#
# `pnpm complexity` runs too, but purely for visibility, not as a blocking gate: `complexity` and
# `sonarjs/cognitive-complexity` are configured `warn`, not `error`, repo-wide (`eslint.config.mjs`),
# so this step cannot fail CI as configured — it currently reports ~15.6k warnings. Turning that into
# a real gate (à la Tovu's `apps/admin`-scoped `check:admin-complexity-drift` ratchet) is a
# repo-wide initiative at a much larger scale than guard's 25, and deliberately out of scope here.
#
# 2026-08-17: `push: branches: [main]` meant this workflow had NEVER fired since it was added the
# day before — all Jini work happens on `general-work` (Tovu and Jini are developed in lockstep on
# same-named branches), which was already dozens of commits ahead with zero CI runs on any of them.
# Identical bug to the one found and fixed in Tovu's own `ci.yml` the same evening. Fixed below:
# `push` now watches every branch, so no future branch is silently unwatched the same way.
# `pull_request` already had no `branches` filter, so PR-triggered runs were never affected.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every workspace package's package.json resolves its `@jini-ai/*` siblings through its own
      # gitignored `dist/` (`types`/`main` both point there — see e.g. packages/daemon/package.json),
      # not source. A fresh checkout has no `dist/` at all, so `pnpm typecheck`'s cross-package
      # resolution fails without a build first (verified: this is exactly what a clean checkout would
      # hit — a local dev tree only avoids it because a prior `pnpm -r run build` left `dist/` on
      # disk). `pnpm guard` and `pnpm complexity` don't need this — the former scans import
      # specifiers as text/AST, the latter isn't type-aware (no `parserOptions.project` in
      # `eslint.config.mjs`) — but building once up front is cheaper than reasoning per-gate about
      # which ones can skip it.
      - run: pnpm -r run build

      - name: guard (ratcheted against scripts/guard-baseline.json — see that file and check-guard-drift.ts)
        id: guard
        run: pnpm guard:drift
        continue-on-error: true

      - name: typecheck
        id: typecheck
        run: pnpm typecheck
        continue-on-error: true

      # Not gated with continue-on-error/an id checked below: `complexity` and
      # `sonarjs/cognitive-complexity` are `warn`-level repo-wide, so this step cannot exit non-zero
      # as currently configured — it is here purely so the warning count is visible in every run's
      # log, not to block anything.
      - name: complexity (informational — warn-level, cannot fail; visibility only)
        run: pnpm complexity

      - name: SonarJS (report-only; counts per rule)
        if: ${{ !cancelled() }}
        run: pnpm quality:sonar
        continue-on-error: true

      # Initial quality-tool rollout: observations only, never included in the gate below.
      - name: knip (report-only)
        if: ${{ !cancelled() }}
        run: pnpm quality:knip
        continue-on-error: true

      - name: dependency-cruiser (report-only)
        if: ${{ !cancelled() }}
        run: pnpm quality:depcruise
        continue-on-error: true

      - name: fast-check properties (report-only)
        if: ${{ !cancelled() }}
        run: pnpm quality:properties
        continue-on-error: true

      - name: fail if a blocking gate failed
        if: steps.guard.outcome == 'failure' || steps.typecheck.outcome == 'failure'
        run: |
          echo "guard:    ${{ steps.guard.outcome }}"
          echo "typecheck: ${{ steps.typecheck.outcome }}"
          exit 1

  secrets-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Free CLI, no organization Action license. Verify before extracting/executing.
      # Pin source: https://github.com/gitleaks/gitleaks/releases/expanded_assets/v8.28.0
      - name: Download checksum-pinned Gitleaks CLI
        id: gitleaks
        env:
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          archive="$download_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/gitleaks-8.28.0"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Gitleaks event scan (report-only)
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
            log_opts="$BASE_SHA..$HEAD_SHA --full-history -m"
          else
            log_opts="$HEAD_SHA --full-history -m"
          fi
          gitleaks git . --config .gitleaks.toml --log-opts="$log_opts" --redact --exit-code=1

      # Reuse the local full-history owner; no Docker/service or licensed Action.
      - name: Gitleaks full history (report-only)
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/quality-secrets.sh --exit-code=1

  # Rule regressions block; application findings and scanner/network failures only report.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Official multi-platform index digest; update tag + digest together after rule tests.
      # https://hub.docker.com/layers/semgrep/semgrep/1.175.0/images/sha256-1623685c0f6388b0bc8d577a712bf92b88252aaa09d6d7e38943dafa10ed978c
      image: semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
    env:
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Trust the mounted checkout for git baseline operations
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Custom Semgrep rule regressions (blocking)
        run: python3 scripts/quality-semgrep.py --test

      - name: Semgrep application scan (report-only; PR baseline)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            git cat-file -e "$BASE_SHA^{commit}"
            python3 scripts/quality-semgrep.py --baseline-commit "$BASE_SHA"
          else
            python3 scripts/quality-semgrep.py
          fi

  # enable when the repo is public (SonarQube Cloud is free for public repos)
  # Before enabling: replace identifiers and generate fresh LCOV with root-relative SF paths.
  sonar-cloud:
    if: ${{ false }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # v6.0.0: https://github.com/SonarSource/sonarqube-scan-action/releases/tag/v6.0.0
      - name: SonarQube Cloud scan (dormant, report-only)
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: >
            -Dproject.settings=development/sonarqube/sonar-project.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
